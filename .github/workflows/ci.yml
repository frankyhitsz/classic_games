name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -c constraints-release.txt -e ".[dev]"
      - run: python -m tests.release release --junit release-results.xml --json release-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-gate-results
          path: |
            release-results.xml
            release-results.json
            release-sbom.json
            release-installed-packages.json
          if-no-files-found: error

  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -c constraints-release.txt -e .
      - run: python -m unittest discover -s tests -p "test_storage*.py"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -c constraints-release.txt -e ".[dev]"
      - name: Run wheel and sdist user-data smoke
        run: python -m tests.wheel_smoke
      - run: python -m ruff check client game_service server tests
      - name: Run storage tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -m coverage run -m unittest discover -s tests -p "test_storage*.py" 2>&1 | tee storage-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            python -c 'from pathlib import Path; text=Path("storage-tests.log").read_text(errors="replace"); detail="\n".join(text.splitlines()[-40:]); detail=detail.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print(f"::error title=Storage test failures::{detail}")'
          fi
          exit ${status}
      - name: Run stress tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -m coverage run --append -m tests.stress 2>&1 | tee stress-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            python -c 'from pathlib import Path; text=Path("stress-tests.log").read_text(errors="replace"); detail="\n".join(text.splitlines()[-30:]); detail=detail.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print(f"::error title=Stress test failures::{detail}")'
          fi
          exit ${status}
      - name: Run gameplay tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          CLASSIC_GAMES_COVERAGE=1 python -m tests.ci_regression 2>&1 | tee gameplay-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            python -c 'from pathlib import Path; text=Path("gameplay-tests.log").read_text(errors="replace"); failed=[line.strip() for line in text.splitlines() if "FAIL:" in line]; detail="\n".join(failed[:12] + ["", *text.splitlines()[-16:]]); detail=detail[:4000].replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print(f"::error title=Gameplay test failures::{detail}")'
          fi
          exit ${status}
      - run: python -m coverage combine --append
      - run: python -m coverage report --fail-under=60
      - run: python -m coverage xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            storage-tests.log
            stress-tests.log
            gameplay-tests.log
            ci-regression.log
          if-no-files-found: ignore

  python-compatibility:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -c constraints-release.txt -e ".[dev]"
      - run: python -m ruff check client game_service server tests
      - run: python -m unittest discover -s tests -p "test_storage*.py"
      - run: python -m tests.ci_regression
