[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-games-hub"
version = "0.9.0"
description = "Five local-first pygame classics with SQLite records"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
api = [
    "flask>=3.0",
    "requests>=2.31",
]
dev = [
    "flask>=3.0",
    "requests>=2.31",
    "coverage>=7.6",
    "ruff>=0.6",
    "pip-audit>=2.10,<3",
    "build>=1.5,<2",
]

[project.scripts]
classic-games = "client.launcher:main"
classic-games-api = "game_service.cli:api_main"
classic-games-data = "game_service.data_cli:main"

[tool.setuptools.packages.find]
include = ["client*", "game_service*", "server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI on the project's established correctness checks. Ruff 0.16 changed
# its implicit rule set; new modernization/style families are adopted only
# after a dedicated cleanup instead of turning an unrelated release red.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["client", "game_service", "server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
